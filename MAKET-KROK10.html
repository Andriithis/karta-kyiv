/* Макет «було / стане» (RISHENNYA, розд. 25, А2; розд. 23, п. 9). Коду карти
   тут немає: лише вигляд на справжній підкладці й справжніх даних однієї
   адреси (вул. Борщагівська, 154), щоб Андрій затвердив або відхилив. */
:root{--sans:Commissioner,"Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 --panel:#fff;--sunk:#f7f7f5;--ink:#14161a;--dim:#5f6771;--faint:#9aa0a9;--rule:#e7e6e3;--ground:#f6f6f4;--halo:#fff;
 --shadow:0 6px 24px rgba(20,22,26,.14),0 1px 3px rgba(20,22,26,.10)}
/* нинішня темна тема сайту */
body[data-t="temna"]{--panel:#0f1217;--sunk:#151920;--ink:#eaebef;--dim:#8d94a2;--faint:#5b6371;--rule:#1f242b;
 --ground:#0c0e12;--halo:#0b0d11;--shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4)}

body[data-t="sutinky"]{--panel:#1f232a;--sunk:#272c34;--ink:#eceef2;--dim:#a3aab6;--faint:#8a92a0;--rule:#343a44;
 --ground:#2b2f36;--halo:#2b2f36;--shadow:0 6px 24px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:44px 0 0 0}
/* ---- смуга макета (не частина карти) ---- */
#mk{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 14px;
 background:#14161a;color:#eceef2;font-size:13px;z-index:50;overflow-x:auto;white-space:nowrap}
#mk b{font-weight:600;margin-right:6px}
#mk .seg{display:flex;border:1px solid #444a55;border-radius:6px;overflow:hidden}
#mk .seg button{all:unset;cursor:pointer;padding:5px 11px;color:#b8bec9}
#mk .seg button[aria-pressed="true"]{background:#eceef2;color:#14161a}
#note{position:absolute;right:14px;bottom:26px;z-index:40;max-width:420px;background:#14161a;color:#eceef2;
 border-radius:8px;padding:10px 13px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#note h3{margin:0 0 4px;font-size:13px}
#note ul{margin:4px 0 0;padding-left:16px}
#note .x{float:right;cursor:pointer;color:#8d94a2;margin-left:8px}
/* ---- спільне для карти ---- */
.card{position:absolute;background:var(--panel);color:var(--ink);border-radius:8px;box-shadow:var(--shadow);z-index:20}
#nav{top:58px;right:14px;width:300px;padding:14px 16px 12px}
#nav .search{border:1px solid var(--rule);border-radius:6px;padding:6px 9px;color:var(--faint);font-size:13px;margin-bottom:10px}
#nav .modes{display:flex;gap:14px;border-bottom:1px solid var(--rule);margin-bottom:10px;font-size:13px}
#nav .modes span{padding-bottom:6px;color:var(--dim)} #nav .modes span.on{color:var(--ink);border-bottom:2px solid var(--ink)}
#nav .types{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;margin-bottom:8px}
#nav .types i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
#nav .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-top:1px solid var(--rule)}
#nav .tog{width:26px;height:14px;border-radius:9px;background:var(--rule)}
#nav a{display:block;color:var(--ink);text-decoration:none;font-size:12.5px;padding:2px 0}
.ctl{position:absolute;top:58px;left:14px;z-index:20;display:flex;flex-direction:column;gap:8px}
.zoom{background:var(--panel);border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;width:32px}
.zoom span{height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;border-bottom:1px solid var(--rule)}
.zoom span:last-child{border:0}
.tsw{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:4px;font-size:12px}
.tsw span{padding:6px 11px;color:var(--dim)} .tsw span.on{background:var(--sunk);color:var(--ink)}
/* ---- БУЛО: вікно над точкою й панель рішень ---- */
#oldpop{position:absolute;z-index:25;width:340px;transform:translate(-50%,-100%);margin-top:-16px;padding:12px 14px}
#oldpop:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
#oldpop b{display:block;font-size:13px;margin-bottom:4px}
.tt{color:var(--dim);font-size:11.5px;margin-bottom:6px}
table.bd{width:100%;border-collapse:collapse;margin-bottom:6px}
table.bd td{padding:2px 0;font-size:12px;vertical-align:top}
table.bd td:last-child{text-align:right;font-family:var(--mono);width:40px}
.hg{display:flex;align-items:flex-end;gap:1px;height:24px;margin:4px 0 1px}
.hg i{flex:1;background:var(--ink);opacity:.8;border-radius:1px 1px 0 0}
.hx{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-family:var(--mono)}
.hxl{font-size:10px;color:var(--faint);text-align:center;margin:-2px 0 6px}
.hn{font-size:11px;color:var(--dim);background:var(--sunk);padding:4px 7px;border-radius:4px;margin:4px 0}
.btn{display:block;width:100%;padding:7px;background:var(--sunk);color:var(--ink);border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:12px;margin-top:6px;cursor:pointer;text-align:center}
#oldpan{top:44px;right:0;bottom:0;width:360px;border-radius:0;padding:14px 16px;overflow:auto;z-index:30}
.cs{border-top:1px solid var(--rule);padding:8px 0}
.cd{font-size:12px;color:var(--dim)} .cd b{color:var(--ink)}
.cx{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45}
.cl a{font-size:11.5px;color:var(--ink)}

#place .ph{padding:14px 16px 0;position:relative}
#place .ph b{display:block;font-size:15px;line-height:1.3;padding-right:36px}
#place .ph .sum{color:var(--dim);font-size:12.5px;margin:3px 0 10px}
#place .close{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--dim);font-size:22px;cursor:pointer;border-radius:6px}
#place .close:hover{background:var(--sunk)}

#place .tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
#place .tb{flex:1;overflow:auto;padding:12px 16px 16px;scrollbar-width:thin}
#place .more{background:none;border:0;padding:4px 0;font:inherit;font-size:12px;color:var(--dim);text-decoration:underline;cursor:pointer}
.near li{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--rule);font-size:12.5px;list-style:none}
.near{margin:0;padding:0}
.near .ic{width:24px;height:24px;border:1.5px solid #fbbf24;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.near .d{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim)}

@media (max-width:700px){
 #nav{display:none}
 #place{left:0;right:0;top:auto;bottom:0;width:auto;height:58vh;border-radius:12px 12px 0 0}
 #oldpan{width:100%}
}
/* ---- смуга зліва вгорі ---- */
#strip{top:58px;left:58px;display:flex;align-items:center;gap:10px;padding:6px 10px;flex-wrap:wrap;max-width:calc(100% - 400px)}
#strip .grp{display:flex;align-items:center;gap:4px}
#strip .lbl{font-size:11px;color:var(--dim);margin-right:2px}
#strip select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel);border:1px solid var(--dim);border-radius:5px;padding:4px 6px;min-height:30px}
#strip .arr{width:30px;height:30px;border:1px solid var(--dim);border-radius:5px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px}
#strip .per{min-width:118px;text-align:center;font-size:13px;font-weight:500}
#strip .per small{display:block;font-size:10px;color:var(--faint);font-weight:400;line-height:1}
#strip .sep{width:1px;height:26px;background:var(--rule)}
.chip{padding:5px 9px;min-height:30px;border:1px solid var(--dim);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#adv{top:58px;right:328px;width:430px;padding:14px 16px}
#adv .ar{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:baseline;font-size:12.5px;margin-bottom:6px}
#adv .ar>span{color:var(--dim)}
#adv .chips{display:flex;flex-wrap:wrap;gap:5px}
#adv h4{margin:10px 0 4px;font-size:13px;border-top:1px solid var(--rule);padding-top:10px}
#adv .fake{height:120px;background:repeating-linear-gradient(var(--panel) 0 18px,var(--sunk) 18px 20px);opacity:.7}

function palNow(){const t=(document.body.dataset.t==='svitla')?'svitla':'temna'; const p=PALS[PALK]; return (p[t]||p.svitla)}
function addOurs(){
 if(hasS('adr')) return;
 map.addSource('adr',{type:'geojson',data:{type:'FeatureCollection',features:D.near.map(([la,lo,a,n,g,pr],i)=>({type:'Feature',id:i,
  geometry:{type:'Point',coordinates:[lo,la]},properties:{a,n,g,pr,sel:a===D.addr?1:0}}))}});
 map.addSource('obj',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 const mx=Math.max(...D.near.map(x=>x[3]));
 map.addLayer({id:'selring',type:'circle',source:'adr',filter:['==',['get','sel'],1],
  paint:{'circle-radius':20,'circle-color':'rgba(0,0,0,0)','circle-stroke-width':2.5,'circle-stroke-color':cssv('--ink'),'circle-stroke-opacity':0}});
 map.addLayer({id:'adr',type:'circle',source:'adr',layout:{'circle-sort-key':['-',0,['get','n']]},
  paint:{'circle-radius':['+',4.9,['*',12.8,['^',['/',['get','n'],mx],.42]]],'circle-opacity':.94,'circle-stroke-width':1.5}});
 map.addLayer({id:'objr',type:'line',source:'obj',filter:['==',['geometry-type'],'LineString'],paint:{'line-color':'#fbbf24','line-width':1,'line-dasharray':[4,4],'line-opacity':.6}});
 map.addLayer({id:'objt',type:'symbol',source:'obj',filter:['==',['geometry-type'],'Point'],
  layout:{'text-field':['get','ic'],'text-size':14,'text-allow-overlap':true},paint:{'text-halo-color':'#fbbf24','text-halo-width':1.2}});
 paintOurs(); render();
}
const hasL=id=>!!(map.style&&map.getLayer(id)), hasS=id=>map.style?map.getSource(id):null;
const cssv=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
function paintOurs(){ if(!hasL('adr')) return; const P=palNow();
 map.setPaintProperty('adr','circle-color',['match',['get','g'],...P.flatMap((c,i)=>[i,c]),'#888']);
 map.setPaintProperty('adr','circle-stroke-color',cssv('--halo'));
 map.setPaintProperty('selring','circle-stroke-color',cssv('--ink'));
 document.querySelectorAll('#nav .types i').forEach((x,i)=>x.style.background=P[i]);
}
// ---- картка-навігатор праворуч (як зараз) ----
function navHTML(){return `<div class="search">Адреса або вулиця</div>
 <div class="modes"><span class="on">Кільця</span><span>Адреси</span><span>Проблеми</span></div>
 <div class="types">${SHORT.map((s,i)=>`<span><i></i>${s}</span>`).join('')}</div>
 <div style="font-size:12px;color:var(--dim);margin-bottom:6px">Розширено ›</div>
 <div class="row"><span>Схожі умови</span><span class="tog"></span></div>
 <div class="row"><span>Населення</span><span class="tog"></span></div>
 <div class="row"><span>Потоки людей</span><span class="tog"></span></div>
 <div class="row"><span>Район</span><span style="color:var(--dim);font-size:12px">усе місто ▾</span></div>
 <a href="#">Проблеми ↗</a><a href="#">Схожі умови ↗</a><a href="#">Стан міста ↗</a>`}
// ---- вміст вікна адреси ----
const TOP=D.arts.slice(0,5), REST=D.arts.slice(5);
const mxh=Math.max(...D.hours,1), nh=D.hours.reduce((a,b)=>a+b,0);
const night=D.hours.slice(20).concat(D.hours.slice(0,4)).reduce((a,b)=>a+b,0);
const hist=`<div class="hg">${D.hours.map((v,i)=>`<i style="height:${Math.max(2,Math.round(22*v/mxh))}px" title="${i}:00 — ${v}"></i>`).join('')}</div>
 <div class="hx"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>`;
const gMax=D.grp.indexOf(Math.max(...D.grp));
const sumLine=`${D.n} ${pl(D.n,'подія','події','подій')} · `+(D.grp[gMax]===D.n?`усі — ${SHORT[gMax].toLowerCase()}`:`переважає ${SHORT[gMax].toLowerCase()}, ${D.grp[gMax]}`);
function oldPopHTML(){return `<b>${esc(D.addr)}</b><div class="tt">${sumLine}</div>
 <table class="bd">${TOP.map(([a,c])=>`<tr><td>${esc(a)}</td><td><b>${c}</b></td></tr>`).join('')}</table>
 <div style="font-size:12px;color:var(--dim);text-decoration:underline">ще ${REST.length}</div>
 ${hist}<div class="hxl">година доби</div><div class="hn">${Math.round(100*night/nh)}% подій припадає на 20:00–04:00</div>
 <div style="display:flex;gap:6px"><span class="btn">Що поруч (250 м)</span><span class="btn">Усі рішення (${D.ndec})</span></div>`}
const decHTML=()=>D.dec.map(([a,d,h,cn,fx])=>`<div class="cs"><div class="cd"><b>${fmtD(d)}</b>${h>=0?' · '+String(h).padStart(2,'0')+':00':''} · ${esc(a)}</div>
 ${cn?`<div class="cd" style="font-size:11px">справа ${esc(cn)}</div>`:''}${fx?`<div class="cx">${esc(fx)}${fx.length>=260?'…':''}</div>`:''}
 <div class="cl"><a href="#">відкрити рішення</a></div></div>`).join('')+(D.ndec>D.dec.length?`<div class="cd" style="padding:8px 0">…і ще ${D.ndec-D.dec.length} — у картці їх видно прокруткою</div>`:'');
function oldPanHTML(){return `<div style="display:flex;justify-content:space-between"><b style="font-size:14px">${esc(D.addr)}</b><span style="color:var(--dim)">×</span></div>
 <div class="cd" style="margin:4px 0 8px">${D.ndec} ${pl(D.ndec,'справа','справи','справ')}</div>${decHTML()}`}
function placeHTML(){
 const tabs=[['ogl','Огляд'],['rish',`Рішення (${D.ndec})`],['near',`Що поруч (${D.obj.length})`]];
 let body='';
 if(PTAB==='ogl') body=`<table class="bd">${TOP.map(([a,c])=>`<tr><td>${esc(a)}</td><td><b>${c}</b></td></tr>`).join('')}
   <tbody id="rest" hidden>${REST.map(([a,c])=>`<tr><td>${esc(a)}</td><td><b>${c}</b></td></tr>`).join('')}</tbody></table>
   ${REST.length?`<button class="more" onclick="document.getElementById('rest').hidden=false;this.remove()">ще ${REST.length}</button>`:''}
   <div style="margin-top:10px">${hist}</div><div class="hxl">година доби</div>
   <div class="hn">${Math.round(100*night/nh)}% подій припадає на 20:00–04:00</div>
   <div class="hn" style="background:none;padding:0;margin-top:10px">Тут же — картка проблеми, коли адреса в переліку, і «Схожі умови» вулиці.</div>`;
 if(PTAB==='rish') body=decHTML();
 if(PTAB==='near') body=`<div class="cd" style="margin-bottom:6px">У радіусі 250 м. Які з цих об'єктів пояснюють скупчення — вирішує той, хто вийде на місце.</div>
   <ul class="near">${D.obj.slice(0,40).map(([la,lo,n,ic,d])=>`<li><span class="ic">${ic}</span>${esc(n)}<span class="d">${d} м</span></li>`).join('')}</ul>`;
 return `<div class="ph"><b>${esc(D.addr)}</b><div class="sum">${sumLine}</div><button class="close" title="Закрити (Esc)">×</button></div>
  <div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" data-p="${k}" aria-selected="${k===PTAB}">${n}</button>`).join('')}</div>
  <div class="tb">${body}</div>`}
// ---- смуга періоду ----
const YEARS=['2023','2024','2025','2026'];
function periods(step){
 if(step==='all') return [['2023–2026','усе']];
 if(step==='year') return YEARS.map(y=>[y,y==='2026'?'по вересень':'']);
 const out=[];
 for(const y of YEARS) for(let m=1;m<=12;m++){ if(y==='2026'&&m>9) break;
  if(step==='month') out.push([`${MISN[m-1]} ${y}`,(y==='2026'&&m>=8)?'неповний':'']);
  else if(m%3===1) out.push([`${(m+2)/3}-й квартал ${y}`,(y==='2026'&&m===7)?'неповний':'']) }
 return out}
let STEP='year', PIDX=2;
function stripHTML(){const ps=periods(STEP); PIDX=Math.min(PIDX,ps.length-1); const [t,sub]=ps[PIDX];
 return `<div class="grp"><span class="lbl">Період</span>
   <select id="step">${[['all','Усе'],['year','Рік'],['quarter','Квартал'],['month','Місяць']].map(([k,n])=>`<option value="${k}"${k===STEP?' selected':''}>${n}</option>`).join('')}</select>
   <button class="arr" id="pv" title="Попередній">‹</button><div class="per" style="${sub==='неповний'?'color:var(--faint)':''}">${t}${sub?`<small>${sub}</small>`:''}</div><button class="arr" id="nx" title="Наступний">›</button></div>
  <span class="sep"></span>
  <div class="grp"><span class="lbl">Час доби</span><select><option>уся доба</option><option>ніч 0–6</option><option>ранок 6–12</option><option>день 12–18</option><option>вечір 18–24</option></select>
   <span class="lbl" title="частка подій із відомою годиною">82% з годиною</span></div>
  <span class="sep"></span>
  <div class="grp">${[['svitla','Світла'],['sutinky','Темна']].map(([k,n])=>`<button class="chip" data-th="${k}" aria-pressed="${THEME===k}">${n}</button>`).join('')}</div>
  <span class="sep"></span>
  <div class="grp">${[['yaskrava','Яскрава'],['kreida','Крейдяна'],['hrafit','Графітова']].map(([k,n])=>`<button class="chip" data-pal="${k}" aria-pressed="${PALK===k}">${n}</button>`).join('')}</div>`}
function advOldHTML(){return `<div class="ar"><span>Рік</span><div class="chips">${YEARS.map(y=>`<button class="chip" aria-pressed="true">${y}</button>`).join('')}</div></div>
 <div class="ar"><span>Час доби</span><div class="chips">${['ранок 6–12','день 12–18','вечір 18–24','ніч 0–6'].map(y=>`<button class="chip" aria-pressed="true">${y}</button>`).join('')}</div></div>
 <div class="ar"><span>Кольори</span><div class="chips"><button class="chip" aria-pressed="true">Яскрава</button><button class="chip">Крейдяна</button><button class="chip">Графітова</button></div></div>
 <h4>Статті</h4><div class="fake"></div>`}
function advNewHTML(){return `<h4 style="border:0;margin-top:0;padding-top:0">Статті</h4><div class="fake"></div>
 <div class="cd" style="margin-top:6px">Рік, час доби й кольори — у смузі зліва вгорі; тут лишаються статті й «Лише точні адреси».</div>`}
// ---- пояснення для Андрія ----
const NOTES={
 a2:{bulo:['Було: три окремі панелі','Вікно над точкою, панель рішень праворуч поверх навігатора, «Що поруч» — значками на карті. Вікно закриває місце, про яке розповідає.'],
     stane:['Стане: одна картка місця зліва (розд. 25, А2)','<ul><li>Вкладки «Огляд · Рішення (N) · Що поруч (N)» — як у Google Maps і police.uk.</li><li>Адреса й підсумок закріплені вгорі; × — 36 px; Esc і клік по порожній карті закривають.</li><li>Над точкою — лише підказка при наведенні (наведіть на крапку). Обране місце — кільцем.</li><li>«Що поруч» — перелік з відстанями, а на карті — ті самі значки й коло 250 м.</li><li>На телефоні картка — знизу, на пів екрана (звузьте вікно).</li></ul>']},
 dark:{bulo:['Було: темна тема — майже чорна','Земля #0c0c0c, вода й дороги ледь відрізняються від тла; на проєкторі в аудиторії карта стає чорною плямою.'],
     stane:['Стане: сутінковий сірий','<ul><li>Земля #2b2f36, вода #27384b, дороги #434953–#5b626d, будинки #373c45, парки з ледь зеленим відтінком.</li><li>Картки — #1f232a, текст #eceef2 (контраст 13,6:1), приглушений — #a3aab6 (6,7:1); підписи на карті #b9c0cb (7,3:1).</li><li>Кольори видів — ті самі, з розд. 23 (Яскрава, темна); ΔE між видами від тла не залежить.</li></ul>']},
 strip:{bulo:['Було: рік, час доби й кольори — у «Розширено»','Щоб переглянути інший рік, треба відкрити другу картку й зняти три галочки з чотирьох. Кварталу й місяця немає.'],
     stane:['Стане: смуга зліва вгорі (розд. 4 і 17)','<ul><li>Період: крок «Усе · Рік · Квартал · Місяць» і стрілки ‹ › — гортають карту в часі. Останні два місяці — сірі, «неповний» (затримка публікації).</li><li>Час доби — друга випадайка, поруч частка подій із відомою годиною.</li><li>Тема і кольори — тут же; у «Розширено» лишаються статті.</li><li>На телефоні смуга згортається в одну кнопку «Період · 2025 ▾».</li></ul>']}};
// ---- малювання стану ----
function show(el,v){$(el).hidden=!v}
function render(){
 document.querySelectorAll('#mtab button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===TAB));
 document.querySelectorAll('#mstan button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===STAN));
 document.body.dataset.t=TAB==='dark'?(STAN==='bulo'?'temna':'sutinky'):(THEME==='svitla'?'svitla':'sutinky');
 const a2=TAB==='a2', dk=TAB==='dark', st=TAB==='strip', old=STAN==='bulo';
 $('#nav').innerHTML=navHTML();
 show('#oldpop',a2&&old); show('#oldpan',a2&&old); show('#place',a2&&!old);
 show('#strip',st&&!old); show('#adv',st&&old);
 show('#tswOld',old||dk); document.querySelectorAll('#tswOld span').forEach((s,i)=>s.className=(i===(document.body.dataset.t==='svitla'?0:1))?'on':'');
 if(a2&&old){$('#oldpop').innerHTML=oldPopHTML(); $('#oldpan').innerHTML=oldPanHTML()}
 if(a2&&!old){$('#place').innerHTML=placeHTML()}
 if(st){$('#adv').innerHTML=old?advOldHTML():advNewHTML(); if(!old) $('#strip').innerHTML=stripHTML()}
 const [h,t]=NOTES[TAB][STAN]; $('#note').innerHTML=`<span class="x" onclick="this.parentNode.hidden=true">×</span><h3>${h}</h3>${t}`; $('#note').hidden=false;
 if(hasL('selring')) map.setPaintProperty('selring','circle-stroke-opacity',a2&&!old?1:0);
 const objOn=a2&&!old&&PTAB==='near';
 if(hasS('obj')){const f=[]; if(objOn){const c=[]; for(let k=0;k<=64;k++){const a=k/64*2*Math.PI; c.push([D.lo+250/(111320*Math.cos(D.la*Math.PI/180))*Math.cos(a),D.la+250/111320*Math.sin(a)])}
   f.push({type:'Feature',geometry:{type:'LineString',coordinates:c}}); for(const [la,lo,n,ic] of D.obj) f.push({type:'Feature',geometry:{type:'Point',coordinates:[lo,la]},properties:{ic}})}
  hasS('obj').setData({type:'FeatureCollection',features:f})}
 paintOurs(); placeOld(); setBase();
}
function placeOld(){ if($('#oldpop').hidden) return; const q=map.project([D.lo,D.la]); $('#oldpop').style.left=q.x+'px'; $('#oldpop').style.top=(q.y+44)+'px'}
map.on('move',placeOld);
// підказка над точкою — лише в «Стане»
map.on('mousemove',e=>{const tip=$('#hovertip'); if(!(TAB==='a2'&&STAN==='stane')||!hasL('adr')){tip.hidden=true;return}
 const f=map.queryRenderedFeatures([[e.point.x-6,e.point.y-6],[e.point.x+6,e.point.y+6]],{layers:['adr']})[0];
 if(!f){tip.hidden=true; map.getCanvas().style.cursor=''; return}
 map.getCanvas().style.cursor='pointer'; tip.hidden=false; tip.style.left=e.point.x+'px'; tip.style.top=(e.point.y+44)+'px';
 tip.innerHTML=`<b>${esc(f.properties.a)}</b> · ${f.properties.n} ${pl(f.properties.n,'подія','події','подій')}`});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v]'); if(t&&t.closest('#mtab')){TAB=t.dataset.v; if(TAB!=='strip') THEME='svitla'; render(); return}
 if(t&&t.closest('#mstan')){STAN=t.dataset.v; render(); return}
 const p=e.target.closest('[data-p]'); if(p){PTAB=p.dataset.p; render(); return}
 if(e.target.closest('#place .close')){$('#place').hidden=true; return}
 const th=e.target.closest('[data-th]'); if(th){THEME=th.dataset.th; render(); return}
 const pa=e.target.closest('[data-pal]'); if(pa){PALK=pa.dataset.pal; render(); return}
 if(e.target.id==='pv'){PIDX=Math.max(0,PIDX-1); render(); return}
 if(e.target.id==='nx'){PIDX=Math.min(periods(STEP).length-1,PIDX+1); render(); return}});
document.addEventListener('change',e=>{ if(e.target.id==='step'){STEP=e.target.value; PIDX=periods(STEP).length-1; render()}});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#place').hidden=true});
render();
</script></body></html>
