name: Аналіз 1551

# Звернення 1551 — «голос мешканців» (RISHENNYA, розд. 31; PIDKHID.md, розд. 5.1;
# src/zbir_1551.py). Щотижня докачує нові місяці, старі не качає повторно.
# Домен data.1551.gov.ua закритий з машин чатів, тож завантаження йде тут.
# Результат кладеться в окрему гілку analiz-1551, щоб не важчав main і не
# перетинався з ботами карти.

on:
  push:
    branches: [main]
    paths: ['src/zbir_1551.py', '.github/workflows/analiz1551.yml']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      months:
        description: 'Місяці РРРР-ММ через пробіл (порожньо — усі з 2025-08)'
        default: ''

permissions:
  contents: write

concurrency:
  group: analiz-1551
  cancel-in-progress: false

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Взяти вже зібране з гілки analiz-1551
        run: |
          git fetch origin analiz-1551 || true
          git checkout origin/analiz-1551 -- data/1551 2>/dev/null || true
          git reset -q
      - name: Докачати й відібрати
        run: python src/zbir_1551.py ${{ github.event.inputs.months }}
      - name: Покласти в гілку analiz-1551
        run: |
          git config user.name  "karta-bot"
          git config user.email "actions@github.com"
          mv data/1551 /tmp/r1551
          git fetch origin analiz-1551 || true
          if git rev-parse --verify origin/analiz-1551 >/dev/null 2>&1; then
            git checkout -B analiz-1551 origin/analiz-1551
          else
            git checkout --orphan analiz-1551 && git rm -rfq . || true
          fi
          mkdir -p data && rm -rf data/1551 && cp -r /tmp/r1551 data/1551
          git add -f data/1551
          git commit -m "1551: завантаження для аналізу $(date +%Y-%m-%d)" || echo "змін немає"
          git push origin analiz-1551
