name: Оновлення карти

on:
  schedule:
    - cron: '0 3 * * 1'        # щопонеділка о 03:00 UTC (06:00 за Києвом)
  workflow_dispatch:            # плюс кнопка ручного запуску
    inputs:
      max_docs:
        description: 'Максимум документів за цей запуск (0 = без обмеження)'
        default: '20000'
      dump_years:
        description: 'Перечитати дамп минулих років (напр. «2023 2024 2025») — після нових статей у labels'
        default: ''
      retrain_risk:
        description: 'Перенавчити модель ризику (крок 4) — довго, вручну раз на кілька місяців'
        type: boolean
        default: false
      doslid_1551:
        description: 'Дослідження 1551 → події (звіт ZVIT-1551, ~1–1,5 год) — окремим запуском від перенавчання'
        type: boolean
        default: false
      bez_dampu:
        description: 'Без свіжого дампу ЄДРСР — останній збережений (коли портал data.gov.ua не відповідає)'
        type: boolean
      n_stab:
        description: 'Прогонів відбору стійкості (100 за методикою; менше — лише якщо не вкладається в час)'
        default: '100'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: karta-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Знімок OSM — з гілки osm (workflow «Знімок OSM», щомісяця; RISHENNYA
      # 35.9): збірка більше не качає OSM сама й не залежить від збоїв
      # Overpass. Знімка ще немає — крок 2 і 2b докачають, як раніше.
      - name: Знімок OSM з гілки osm
        run: |
          if git fetch --depth=1 origin osm && git checkout FETCH_HEAD -- osm; then
            git reset -q
            gunzip -c osm/osm_kyiv_city.json.gz > data/osm_kyiv_city.json
            gunzip -c osm/osm_risks_raw.json.gz > data/osm_risks_raw.json
            echo "знімок OSM від $(cat osm/data.txt)"
          else
            echo "::warning::знімка OSM немає — запустіть «Знімок OSM»"
          fi

      # Дамп ЄДРСР (kyiv_*.csv) між запусками живе в кеші Actions: 07.10 портал
      # data.gov.ua не відповідав, а без дампу крок 0 зупиняв увесь запуск, хоча
      # дамп за той самий день уже качав ранковий. Тепер крок 0 бере останній
      # збережений, якщо портал мовчить (step0_fetch_dump продовжує, коли
      # kyiv_*.csv є), або одразу — галочкою «без свіжого дампу».
      - name: Останній збережений дамп ЄДРСР
        uses: actions/cache/restore@v4
        with:
          path: |
            data/kyiv_*.csv
            data/_dump_data.txt
          key: edrsr-dump-${{ github.run_id }}
          restore-keys: edrsr-dump-

      - name: Крок 0 — свіжий дамп ЄДРСР
        run: |
          if [ -f data/_dump_data.txt ]; then echo "збережений дамп — від $(cat data/_dump_data.txt)"; fi
          if [ "${{ github.event.inputs.bez_dampu }}" = "true" ]; then
            if ls data/kyiv_*.csv >/dev/null 2>&1; then
              echo "::notice::без свіжого дампу — беру збережений від $(cat data/_dump_data.txt 2>/dev/null || echo '?')"
            else
              echo "::warning::збереженого дампу немає — запуск без нових документів"
              echo "BEZ_DAMPU=1" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          # Архів не приїхав і збереженого немає — запуск не зупиняється, а йде
          # на знімку events.csv.gz без нових документів (Андрій 07.10, варіант 2)
          if ! python src/step0_fetch_dump.py $(date +%Y); then
            echo "::warning::дампу ЄДРСР немає — запуск без нових документів; у рішень $(date +%Y) не буде посилань на текст до наступного дампу"
            echo "BEZ_DAMPU=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # минулий рік добираємо раз на місяць (перший понеділок)
          if [ "$(date +%d)" -le 07 ]; then
            python src/step0_fetch_dump.py $(( $(date +%Y) - 1 )) || true
          fi
          # Нові статті в labels (RISHENNYA 34.2) у минулих роках мають інші
          # коди категорій — щоб їхні документи потрапили в чергу кроку 1,
          # архів тих років треба перечитати (разово, полем dump_years)
          for y in ${{ github.event.inputs.dump_years }}; do
            python src/step0_fetch_dump.py $y || echo "дамп $y не прочитано"
          done
          # номери справ і посилання минулих років (data/posylannya): качає
          # лише ті роки, яких ще немає, тобто зазвичай нічого
          python src/step0_fetch_dump.py --posylannya || true

      - name: Зберегти дамп ЄДРСР на наступні запуски
        if: ${{ github.event.inputs.bez_dampu != 'true' && env.BEZ_DAMPU != '1' && hashFiles('data/kyiv_*.csv') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/kyiv_*.csv
            data/_dump_data.txt
          key: edrsr-dump-${{ github.run_id }}

      - name: Крок 1 — тексти рішень і адреси
        env:
          MAX_DOCS: ${{ github.event.inputs.max_docs || '20000' }}
        run: python src/step1_download.py

      - name: Крок 2 — геокодування
        run: python src/step2_geocode.py

      - name: Крок 2b — установи зі знімка OSM
        run: |
          # Без «|| echo»: обов'язкових категорій немає — запуск зупиняється
          # (ZAVDANNYA-31, 1.3); необов'язкові крок пропускає сам, з рядком у журналі.
          python src/step2b_risks.py

      # Крок 2c (прохідність) — окремим щомісячним workflow «Прохідність»
      # (RISHENNYA 35.9): збірка бере готовий data/network.json з main.

      - name: Крок 2d — межі районів
        run: python src/step2d_borders.py || echo "межі районів пропущено (файл уже є або OSM недоступний)"

      # Голос мешканців (RISHENNYA, розд. 31): відбір проблем В1 бере скарги
      # 1551 з гілки analiz-1551. У main вони не комітяться — лише для збірки.
      - name: Дані 1551 для збірки
        run: |
          if git fetch --depth=1 origin analiz-1551 && git checkout FETCH_HEAD -- data/1551; then
            git reset -q -- data/1551
            echo "1551: $(ls data/1551 | wc -l) файлів"
          else
            echo "1551 недоступний — голос мешканців буде «даних немає»"
          fi

      - name: Крок 4 — модель ризику
        env:
          N_STAB: ${{ github.event.inputs.n_stab || '100' }}
        run: |
          RETRAIN="${{ github.event.inputs.retrain_risk }}"
          # автоматично раз на місяць — у перший понеділок; решту тижнів
          # модель лишається тією, що вже натренована (це економить ~20 хв на запуск).
          # Лише за розкладом: ручний запуск у перші 7 днів місяця (напр.
          # «Дослідження 1551» 07.10) інакше перенавчав би модель удруге.
          if [ "$RETRAIN" != "true" ] && [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%d)" -le 07 ]; then
            RETRAIN=true
            echo "перший тиждень місяця — перенавчаю модель автоматично"
          fi
          if [ "$RETRAIN" = "true" ]; then
            # statsmodels — негативна біноміальна; відбір стійкості — src/rtm.py
            # (ZAVDANNYA-30, 3.3). Оцінка 30.09: ~1,7–2,7 год на раннері при 100 прогонах
            pip install --quiet numpy scikit-learn statsmodels
            python src/step4_engine.py
          else
            echo "модель ризику цього запуску не перенавчається"
          fi

      # Дослідження 1551 -> події (ZAVDANNYA-30, 3.7): лише звіт, у модель нічого
      # не вмикає. Окремою галочкою: разом із перенавчанням запуск міг би не
      # вкластися в 330 хв (оцінка 30.09 — ZVIT-30).
      - name: Дослідження 1551
        if: ${{ github.event.inputs.doslid_1551 == 'true' }}
        env:
          N_STAB: ${{ github.event.inputs.n_stab || '100' }}
        run: |
          pip install --quiet numpy scikit-learn statsmodels
          python src/doslid_1551.py || echo "дослідження 1551 не вдалося — дивіться журнал"

      - name: Крок 3 — збірка карти
        run: |
          # numpy — нульовий рівень Р8 у відборі проблем (problems.py)
          pip install --quiet numpy
          python src/step3_map.py

      - name: Крок 5 — сайт з районами (викладач/слухач)
        run: python src/step5_site.py

      # Самоперевірка збірки (ZAVDANNYA-30, ч. 5): компіляція, розмітка, JS,
      # установи не на карті, шари ризику з PAI на довжину ≥ 3. Упала — сайт
      # не публікується і стан у репозиторій не зберігається: наступні кроки не
      # запускаються. Раніше перевірка йшла після збереження, і зламані risk.json
      # чи engine_report.json встигали потрапити в main (ZVIT-33, А4).
      - name: Перевірка збірки
        run: python src/check_build.py

      # Перевірка впала — у main нічого не йде, але звіт моделі після годин
      # перенавчання лишається артефактом запуску, щоб розібратися без повтору
      - name: Звіт моделі, якщо перевірка впала
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zvit-modeli
          path: |
            data/engine_report.json
            data/risk.json
            ZVIT-KROK7.md
            ZVIT-1551-ZAKONOMIRNOSTI.md
          if-no-files-found: ignore

      - name: Зберегти стан у репозиторії
        run: |
          git config user.name  "karta-bot"
          git config user.email "actions@github.com"
          for f in data/events.csv.gz data/formy.csv.gz data/formy_dovidnyk.csv data/ustanovy.json data/network.json data/vykluchennya.txt data/borders.json data/engine_report.json data/risk.json data/radiusy.json data/problems_report.json ZVIT-KROK7.md ZVIT-1551-ZAKONOMIRNOSTI.md; do
            [ -f "$f" ] && git add -f "$f" && echo "додано $f"
          done
          [ -d data/posylannya ] && git add -f data/posylannya && echo "додано data/posylannya"
          [ -d data/katehorii ] && git add -f data/katehorii && echo "додано data/katehorii"
          if git diff --quiet --cached; then
            echo "змін немає"
          else
            git commit -m "оновлення даних $(date +%Y-%m-%d)"
            # Два запуски поспіль (перенавчання й «Дослідження 1551» 07.10) міняли ті
            # самі файли даних, і rebase зупинявся на конфлікті двійкових
            # events.csv.gz — стан не зберігався, сайт не публікувався. Дані
            # цього запуску новіші: при конфлікті беремо їх (-X theirs у rebase —
            # це коміт, що переноситься)
            git pull --rebase --autostash -X theirs origin main || true
            git push
          fi

      # Версія одна для всіх: поділу на викладацьку й слухацьку більше немає.
      # Перелік проблем відкритий — перший крок ланцюга саме «обрати проблему
      # зі списку», а робота слухача починається далі, за SARA.
      - name: Підготувати публічну сторінку
        run: |
          if [ ! -f site/kyiv.html ] || [ ! -f site/index.html ]; then
            echo "::error::site/ не зібрано — дивіться крок 5"
            exit 1
          fi
          rm -rf _site && mkdir -p _site
          cp -r site/. _site/
          printf '%s' "$(date -u +'%Y-%m-%d %H:%M UTC')" > _site/updated.txt
          echo "публікується файлів: $(ls _site | wc -l)  розмір: $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4