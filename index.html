/* ---- ТРИ ТЕМИ ----
   Набори змінних узято з погодженого макета PROBA-VYGLIADU.html. Колір ніде
   не стоїть літералом навмисно: інакше світла тема лишилася б темною в тих
   місцях, куди не дійшли руки. Набір обирає атрибут data-t на <body> —
   його ставить tpl_map з localStorage. Перший набір продубльовано на голий

body,body[data-t="svitla"]{--panel:#fff;--sunk:#f7f7f5;--ink:#14161a;--dim:#5f6771;

 --glass:rgba(255,255,255,.80);--shadow:drop-shadow(0 1px 1.5px rgba(16,18,22,.22));

body[data-t="temna"]{--panel:#0f1217;--sunk:#151920;--ink:#eaebef;--dim:#8d94a2;

 --glass:rgba(15,18,23,.78);--shadow:drop-shadow(0 1px 2px rgba(0,0,0,.55));
 --card:rgba(20,23,29,.94);--card-shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4)}
:root{--sans:Commissioner,"Segoe UI",system-ui,sans-serif;

 --disp:Unbounded,Commissioner,sans-serif}

 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

   за змістом (RISHENNYA, розд. 18). Значення — з затвердженого макета
   site/maket-panel.html, версія 4: будь-яка зміна вигляду спершу
   узгоджується на макеті, тож тут їх не підбирати на око. */
#wrap{position:relative;height:100%}

 background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

.sw[aria-pressed="true"] .tog{background:var(--ink)}
.sw[aria-pressed="true"] .tog::after{left:14px}

// фільтром і якого кольору кожна крапка. Жодного звертання до карти — цим
// користуються обидві збірки, щоб правило кольору лишалося одне на дві.
// Колір місця — одне правило для кола адреси, соти й стовпчика (S-К.6, 36.34,
// повертає 35.6): вид, якого тут БІЛЬШЕ, НІЖ У СЕРЕДНЬОМУ ПО МІСТУ — найбільше
// (частка тут) / (частка в місті) серед видів з ≥ max(3, 10%) подій місця, щоб
// одна подія не фарбувала. Жоден вид не набрав мінімуму — найчисленніший.
// «Найчисленніший» для всіх (36.23.3) робив майже всі соти ДТП, і не було
// видно, куди перехил (В2). Проблема колір не перебиває — вона лише контур (S-К.7).

function kolirMisca(g,mg,mn){

 for(let gi=0;gi<M.groups.length;gi++){const v=g[gi]||0; n+=v; if(v>bn){bn=v;best=gi}}

// MapLibre не вміє тягнути плитки для камери, якої ще немає, тож тур сам

function turNapered(S){const t=tnUrl(); let lan=Promise.resolve(), c=[30.52,50.45];
 S.gotovo=S.zup.map(z=>{const tak=z.lat&&z.lon, misto=z.typ==='chyslo', p0=c;

 const TURY_K=[...(TUR_KOLODA&&TUR_KOLODA.length?[{nazva:'Мікс',zup:null}]:[]),
  ...TURY.map(t=>({nazva:t.nazva,zup:t.zupynky.map(z=>turIzTury(z,t.nazva))}))];
 panel.querySelector('.ki-tury').innerHTML=TURY_K.map((t,i)=>`<button data-kt="${i}">${esc(t.nazva)}</button>`).join('');
 panel.querySelector('.ki-vydy').innerHTML=M.groups.map((g,gi)=>`<button data-kg="${gi}"><i style="background:${PALA[gi%PALA.length]}"></i>${esc(shortOf(gi))}</button>`).join('');
 panel.querySelector('.ki-rai').innerHTML=DN.map((d,i)=>`<button data-kr="${i}">${esc(d)}</button>`).join('');
 let OST=Date.now(), ZASTAVKA=true;
 const turK=i=>{const t=TURY_K[i]; if(!t) return; turPusk(t.zup||turZupynky(),{nazva:t.zup?t.nazva:'',kolom:true})};
 // на заставці — колода (якщо є), інакше всі іменовані тури поспіль
 const turVsi=()=>turPusk(turZupynky(),{kolom:true});
 function naZastavku(){ZASTAVKA=true; zvukVymk(); panel.hidden=verkh.hidden=start.hidden=true; zast.hidden=dotyk.hidden=false;
  // заставка — усі роки: інакше тур ішов би по одному місяцю, де зупинилось «▶»
  if(PLAY) prohraty(false); if(STEP!=='all'){STEP='all'; perSet()}
  if(CURD>=0) exitDistrict(); turVsi()}
 function rozbudyty(){ZASTAVKA=false; zast.hidden=dotyk.hidden=true; panel.hidden=verkh.hidden=start.hidden=false; turStop(false);
  kyivPravoruch()}
 // Київ — праворуч від панелі (рев'ю ZVIT-41, п.4). fitBounds тут не годиться:
 // у 3D нахил за зумом повертається до 55°, а fitBounds рахує зум без нахилу, і
 // ближній край міста виходив за екран; cameraForBounds у MapLibre 6 ще й
 // повертає центр під відступи, яких easeTo без padding не знає (налагоджено
 // в браузері 01.11). Тож — кілька кроків: проєктуємо самі точки подій (1–99-й
 // перцентилі, щоб окремі околиці не стискали місто), зсуваємо їх у вільну
 // частину екрана й міняємо зум, доки не вляжуть; потім — плавно туди.
 function kyivPravoruch(){
  const pts0=P.filter((p,i)=>p[3]&&i%5===0).map(p=>[p[1],p[0]]); if(pts0.length<10) return;
  const lo=pts0.map(q=>q[0]).sort((a,b)=>a-b), la=pts0.map(q=>q[1]).sort((a,b)=>a-b), q=(a,f)=>a[Math.floor(a.length*f)];
  const b=[[q(lo,.01),q(la,.01)],[q(lo,.99),q(la,.99)]];
  const pts=pts0.filter(([x,y])=>x>=b[0][0]&&x<=b[1][0]&&y>=b[0][1]&&y<=b[1][1]);
  const bulo={center:map.getCenter(),zoom:map.getZoom(),pitch:map.getPitch(),bearing:map.getBearing()};
  const pad=sidePad(), W=map.getContainer().clientWidth, H=map.getContainer().clientHeight;
  const L=pad.left, R=W-pad.right, T=pad.top, B=H-pad.bottom, pitch=MODE==='stovp'?pitch3d(11):0;
  map.jumpTo({center:[(b[0][0]+b[1][0])/2,(b[0][1]+b[1][1])/2],zoom:11,bearing:0,pitch});
  for(let k=0;k<15;k++){const pp=pts.map(x=>map.project(x)), xs=pp.map(p=>p.x), ys=pp.map(p=>p.y);
   const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
   const dx=(x0+x1)/2-(L+R)/2, dy=(y0+y1)/2-(T+B)/2, s=Math.max((x1-x0)/(R-L),(y1-y0)/(B-T));
   if(Math.abs(s-1)<.01&&Math.abs(dx)<3&&Math.abs(dy)<3) break;
   map.panBy([dx,dy],{duration:0}); map.setZoom(map.getZoom()-Math.log2(s))}
  const ciel={center:map.getCenter(),zoom:map.getZoom(),pitch:map.getPitch(),bearing:0};
  map.jumpTo(bulo); map.easeTo({...ciel,duration:1200})}
 // дотик будь-де: на заставці — будить, під час туру — зупиняє тур
 root.addEventListener('pointerdown',e=>{OST=Date.now();
  if(ZASTAVKA){e.stopPropagation(); rozbudyty(); return}
  if(turIde()&&!e.target.closest('[data-kt]')) turStop(false)},true);
 panel.onclick=e=>{const t=e.target.closest('[data-kt]'); if(t) return turK(+t.dataset.kt);
  const g=e.target.closest('[data-kg]'); if(g){const b=document.querySelector(`#fa .type[data-g="${g.dataset.kg}"]`); if(b) b.click();
   g.classList.toggle('ki-off',b&&!typeOn(+g.dataset.kg)); return}
  const r=e.target.closest('[data-kr]'); if(r) enterDistrict(+r.dataset.kr)};
 verkh.onclick=e=>{ if(e.target.closest('[data-kplay]')) return prohraty(!PLAY);
  const b=e.target.closest('[data-kv]'); if(b) setView(b.dataset.kv)};
 paintPlay();
 start.onclick=naZastavku;
 setInterval(()=>{ if(PLAY) OST=Date.now();   // «▶ програти» — теж робота з кіоском
  const t=(Date.now()-OST)/1000;
  if(!ZASTAVKA&&t>180) naZastavku();
  else if(!ZASTAVKA&&t>90&&!turIde()) turVsi()},1000);
 naZastavku();
 kioskKesh(()=>ZASTAVKA);
})()}
// ---- кіоск без мережі й нічне оновлення (36.122, S-Н.16) ----
// sw.js тримає кеш; тут — що покласти в нього одразу: файли сайту з kesh.json
// (збірка), підкладку Києва до z14 (з нею й будинки туру) і шрифти підписів.
// Раз на ніч, коли кіоск на заставці й мережа є, він питає нову версію
// сторінки повз кеш; змінилась — кладе нові файли й перезавантажується сам.
const KK_BBOX=[30.23,50.21,30.83,50.59], KK_ZUM=[5,14], KK_NICH=[2,5], KK_GLIFY=['0-255','256-511','1024-1279','8192-8447'];
async function kkPoklasty(urls,znovu){const k=await caches.open('karta-kiosk-1'); let i=0;
 const potik=async()=>{while(i<urls.length){const u=urls[i++];
  try{ if(!znovu&&await k.match(u)) continue; const v=await fetch(u,{cache:znovu?'no-cache':'default'}); if(v.ok) await k.put(u,v)}catch(e){}}};
 await Promise.all([1,2,3,4].map(potik))}
function kkPidkladka(){const s=map.getSource('openmaptiles'), t=s&&s.tiles&&s.tiles[0]; if(!t) return [];
 const o=[], [w,pd,e,pn]=KK_BBOX;
 for(let z=KK_ZUM[0];z<=KK_ZUM[1];z++){const n=2**z, tx=lo=>Math.floor((lo+180)/360*n),
   ty=la=>{const f=la*Math.PI/180; return Math.floor((1-Math.log(Math.tan(f)+1/Math.cos(f))/Math.PI)/2*n)};
  for(let x=tx(w);x<=tx(e);x++) for(let y=ty(pn);y<=ty(pd);y++) o.push(t.replace('{z}',z).replace('{x}',x).replace('{y}',y))}
 const st=map.getStyle(), g=st.glyphs, shr=new Set();
 (st.layers||[]).forEach(l=>{const f=l.layout&&l.layout['text-font']; if(Array.isArray(f)&&typeof f[0]==='string') shr.add(f.join(','))});
 if(g) shr.forEach(f=>KK_GLIFY.forEach(d=>o.push(g.replace('{fontstack}',encodeURIComponent(f)).replace('{range}',d))));
 // перший показ кіоску йде ще повз sw.js — сторінку, стиль, TileJSON і значки кладемо самі
 const sp=[].concat(st.sprite||[]).map(x=>typeof x==='string'?x:x.url);
 sp.forEach(u=>['','@2x'].forEach(k=>o.push(u+k+'.json',u+k+'.png')));
 Object.values(st.sources||{}).forEach(q=>{ if(q.url&&/^https:/.test(q.url)) o.push(q.url)});
 o.push(OFM[THEME]||OFM.svitla);
 return o}
async function kkVse(znovu){
 try{const f=await (await fetch('kesh.json?perevirka='+Date.now())).json(); f.push(location.href); await kkPoklasty(f,znovu)
  // старі файли даних попередньої збірки — геть, щоб кеш не ріс щотижня
  if(znovu){const k=await caches.open('karta-kiosk-1'), tak=new Set(f.map(u=>new URL(u,location.href).href));
   for(const q of await k.keys()) if(/\/dani\//.test(q.url)&&!tak.has(q.url)) await k.delete(q)}}catch(e){}
 await kkPoklasty(kkPidkladka(),false)}
function kioskKesh(prostii){ if(!('serviceWorker' in navigator)) return;
 navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
  // карта вже стоїть — підкладку беремо з її стилю
  const pusk=()=>kkVse(false); if(STYLE_OK) pusk(); else map.once('idle',pusk)}).catch(()=>{});
 let bulo=null;
 setInterval(async()=>{const h=new Date().getHours(), d=new Date().toDateString();
  if(h<KK_NICH[0]||h>=KK_NICH[1]||bulo===d||!prostii()||!navigator.onLine) return;
  try{const v=await fetch('index.html?perevirka='+Date.now(),{cache:'no-store'}); if(!v.ok) return;
   bulo=d; const t=await v.text(), m=t.match(/"meta":"([^"]+)"/);
   if(m&&m[1]!==DANI.meta){await kkVse(true); location.reload()}}catch(e){}},60000)}
