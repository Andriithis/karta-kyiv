<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Макет «було / стане», друга редакція (RISHENNYA, розд. 25, рішення 27.09).
   Коду карти тут немає: вигляд на справжній підкладці й справжніх даних двох
   адрес — звичайної (Борщагівська, 154) і з проблемою (Депутатська, 6). */
:root{--sans:Commissioner,"Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 --panel:#fff;--sunk:#f7f7f5;--ink:#14161a;--dim:#5f6771;--faint:#6f7680;--rule:#e7e6e3;--ground:#f6f6f4;--halo:#fff;
 --glass:rgba(255,255,255,.62);--shadow:0 6px 24px rgba(20,22,26,.14),0 1px 3px rgba(20,22,26,.10)}
/* затверджена темна — сутінковий сірий (27.09) */
body[data-t="temna"]{--panel:#1f232a;--sunk:#272c34;--ink:#eceef2;--dim:#a3aab6;--faint:#8a92a0;--rule:#343a44;
 --ground:#2b2f36;--halo:#2b2f36;--glass:rgba(31,35,42,.55);--shadow:0 6px 24px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:44px 0 0 0}
#mk{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 14px;
 background:#14161a;color:#eceef2;font-size:13px;z-index:50;overflow-x:auto;white-space:nowrap}
#mk b{font-weight:600}
#mk .seg{display:flex;border:1px solid #444a55;border-radius:6px;overflow:hidden;flex:none}
#mk .seg button{all:unset;cursor:pointer;padding:5px 11px;color:#b8bec9}
#mk .seg button[aria-pressed="true"]{background:#eceef2;color:#14161a}
#mk .i{all:unset;cursor:pointer;color:#b8bec9;text-decoration:underline}
#note{position:absolute;right:12px;bottom:40px;z-index:40;width:380px;max-width:calc(100% - 24px);background:#14161a;color:#eceef2;
 border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#note h3{margin:0 0 4px;font-size:13px}
#note ul{margin:4px 0 0;padding-left:16px}
#note .x{float:right;cursor:pointer;color:#8d94a2;margin-left:8px;font-size:16px;line-height:1}
.card{position:absolute;background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);z-index:20}
#nav{top:56px;right:12px;width:300px;padding:14px 16px 12px}
#nav .search{border:1px solid var(--rule);border-radius:6px;padding:7px 9px;color:var(--dim);font-size:13px;margin-bottom:10px}
#nav .modes{display:flex;gap:14px;border-bottom:1px solid var(--rule);margin-bottom:10px;font-size:13px}
#nav .modes span{padding:6px 0;color:var(--dim)} #nav .modes span.on{color:var(--ink);border-bottom:2px solid var(--ink)}
#nav .types{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px;margin-bottom:8px}
#nav .types i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
#nav .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;min-height:32px;border-top:1px solid var(--rule)}
#nav .tog{width:26px;height:14px;border-radius:9px;background:var(--rule)}
#nav a{display:flex;align-items:center;min-height:30px;color:var(--ink);text-decoration:none;font-size:12.5px}
.zoom{position:absolute;z-index:20;background:var(--panel);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;width:34px}
.zoom span{height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;border-bottom:1px solid var(--rule)}
.zoom span:last-child{border:0}
#zoomOld{top:56px;left:12px} #zoomNew{right:12px;bottom:40px;z-index:19}
.tsw{position:absolute;top:136px;left:12px;z-index:20;display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:4px;font-size:12px}
.tsw span{padding:6px 11px;color:var(--dim)} .tsw span.on{background:var(--sunk);color:var(--ink)}
#oldpop{position:absolute;z-index:25;width:340px;transform:translate(-50%,-100%);margin-top:-16px;padding:12px 14px;border-radius:8px}
#oldpop:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--panel);border-bottom:0}
#oldpan{top:44px;right:0;bottom:0;width:360px;border-radius:0;padding:14px 16px;overflow:auto;z-index:30}
.tt{color:var(--dim);font-size:12.5px}
table.bd{width:100%;border-collapse:collapse;margin:4px 0}
table.bd td{padding:3px 0;font-size:12.5px;vertical-align:top}
table.bd td:last-child{text-align:right;font-family:var(--mono);width:40px;font-weight:500}
.hg{display:flex;align-items:flex-end;gap:1px;height:26px;margin:6px 0 1px}
.hg i{flex:1;background:var(--ink);opacity:.8;border-radius:1px 1px 0 0}
.hx{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:var(--mono)}
.hxl{font-size:10.5px;color:var(--faint);text-align:center;margin:-2px 0 6px}
.hn{font-size:12px;color:var(--dim);background:var(--sunk);padding:5px 8px;border-radius:5px;margin:6px 0}
.btn{display:block;width:100%;min-height:32px;padding:7px;background:var(--sunk);color:var(--ink);border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer;text-align:center}
.lnk{background:none;border:0;padding:6px 0;min-height:32px;font:inherit;font-size:12.5px;color:var(--ink);text-decoration:underline;cursor:pointer;text-underline-offset:3px}
.cs{border-top:1px solid var(--rule);padding:8px 0}
.cd{font-size:12px;color:var(--dim)} .cd b{color:var(--ink)}
.cx{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45}
#place{top:100px;left:12px;width:384px;max-height:min(70vh,calc(100% - 112px));display:flex;flex-direction:column;overflow:hidden}
#place .ph{padding:14px 16px 0;position:relative;flex:none}
#place .badge{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
#place .ph b{display:block;font-size:16px;line-height:1.3;padding-right:36px}
#place .ph .sum{color:var(--dim);font-size:12.5px;margin:3px 0 8px}
#place .close{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--dim);font-size:22px;cursor:pointer;border-radius:8px}
#place .close:hover{background:var(--sunk)}
#place .tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);padding:0 10px;flex:none}
#place .tabs button{all:unset;cursor:pointer;padding:9px 8px 8px;min-height:18px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent}
#place .tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
#place .tb{overflow:auto;padding:10px 16px 14px;scrollbar-width:none;overscroll-behavior:contain}
#place .tb::-webkit-scrollbar{display:none}
#place .pcard{border-left:3px solid var(--ink);background:var(--sunk);border-radius:6px;padding:9px 11px;margin:2px 0 10px}
#place .pcard .h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#place .pcard .t{font-size:14px;font-weight:600;margin:1px 0 4px}
.dec{border-top:1px solid var(--rule);padding:8px 0;cursor:pointer}
.dec:first-child{border-top:0}
.dec .l1{font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.dec .l1 b{font-weight:600}
.dec .l1 .h{color:var(--dim);font-family:var(--mono);font-size:11.5px}
.dec .l2{font-size:12px;color:var(--dim)}
.dec .l3{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dec.open .l3{white-space:normal}
.dec .more{display:none;margin-top:4px;font-size:12px}
.dec.open .more{display:block}
.dec .more a{color:var(--ink)}
.dec .pm{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--ink);margin-right:4px;vertical-align:1px}
.near{margin:0;padding:0}
.near li{display:flex;gap:8px;align-items:center;min-height:32px;border-top:1px solid var(--rule);font-size:12.5px;list-style:none}
.near .ic{width:24px;height:24px;border:1.5px solid #fbbf24;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.near .d{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
#hovertip{position:absolute;z-index:26;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
 border-radius:6px;padding:5px 9px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);transform:translate(12px,-50%)}
#per{position:absolute;top:56px;left:12px;z-index:21;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;
 background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12.5px;color:var(--ink)}
#per button{all:unset;cursor:pointer;min-width:30px;min-height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--ink)}
#per button:hover{background:var(--sunk)}
#per .cur{min-width:118px;font-weight:600;text-align:center;line-height:1.1}
#per .cur small{display:block;font-weight:400;font-size:10px;color:var(--faint)}
#per .st{color:var(--dim);padding:0 5px;font-size:12px}
#per .st[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
#per .sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#per .dot{width:18px;height:18px;min-width:0;min-height:0;border-radius:50%;margin:6px;box-shadow:0 0 0 1px var(--rule)}
#per .dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
#per .mini{font-size:12px;padding:0 7px;color:var(--dim)}
#todm{position:absolute;top:96px;z-index:30;padding:4px;min-width:150px}
#todm button{all:unset;display:block;cursor:pointer;padding:7px 10px;min-height:18px;border-radius:6px;font-size:12.5px}
#todm button:hover{background:var(--sunk)}
#todm button[aria-pressed="true"]{font-weight:600}
#per #perPhone{display:none}
@media (max-width:700px){
 #nav{display:none}
 #place{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:min(70vh,calc(100% - 120px))}
 #per>*{display:none} #per #perPhone{display:inline-flex;min-width:96px;font-weight:600}
 #oldpan{width:100%}
 #zoomNew{display:none}
}
</style></head><body>
<div id="mk"><b>Макет кроку 10 · друга редакція</b>
 <div class="seg" id="mstan"><button data-v="bulo">Було</button><button data-v="stane">Стане</button></div>
 <div class="seg" id="mpl"><button data-v="0">Звичайна адреса</button><button data-v="1">Адреса з проблемою</button></div>
 <button class="i" id="mnote">Що змінюється</button>
 <span style="color:#8d94a2">Дані справжні. Карта в макеті нічого не фільтрує.</span>
</div>

<div class="zoom" id="zoomNew"><span>+</span><span>−</span></div>

<div id="hovertip" hidden></div>
<div id="note"></div>
<script>

 return out}

 return `<button id="pv" title="Попередній період">‹</button><span class="cur" style="${sub==='неповний'?'color:var(--faint)':''}">${t}${sub?`<small>${sub}</small>`:''}</span><button id="nx" title="Наступний період">›</button>
  ${[['all','Усе'],['year','Рік'],['quarter','Квартал'],['month','Місяць']].map(([k,n])=>`<button class="st" data-st="${k}" aria-pressed="${k===STEP}">${n}</button>`).join('')}
  <span class="sep"></span><button class="mini" id="todb" title="Час доби">🕘 ${TOD} ▾</button>
  <span class="sep"></span><button id="thb" title="${THEME==='svitla'?'Темна тема':'Світла тема'}">${THEME==='svitla'?'☾':'☀'}</button>
  <span class="sep"></span>${Object.entries(PALS).map(([k,p])=>{const c=(THEME==='temna'&&p.temna)?p.temna:p.svitla;
   return `<button class="dot" data-pal="${k}" aria-pressed="${k===PALK}" title="Кольори: ${p.n}" style="background:conic-gradient(${c.map((x,i)=>`${x} ${i*100/7}% ${(i+1)*100/7}%`).join(',')})"></button>`}).join('')}
  <button id="perPhone">${t} ▾</button>`}
const NOTES={
 bulo:['Було','<ul><li>Вікно над точкою закриває саме місце; панель рішень — суцільна смуга від краю до краю поверх навігатора; «Що поруч» — значками на карті окремо.</li><li>Картка проблеми показує всі події адреси разом.</li><li>Рік, час доби й кольори — у «Розширено», тема — дві кнопки ліворуч.</li></ul>'],
 stane:['Стане (рішення 27.09)','<ul><li>Карта на весь екран, усі картки плавають із відступом 12 px, заокруглені, з тінню.</li><li>Ліворуч — картка місця, завжди на тому самому місці: «Огляд · Рішення (N) · Що поруч (N)», до 70% висоти, прокрутка без повзунка.</li><li>«Рішення»: 2–3 рядки на рішення, клік розгортає одне, «відкрити рішення» — посилання. Окремої панелі немає.</li><li>Проблема (перемкніть угорі): лише її події; решта — «усі події адреси (N)».</li><li>Над точкою — лише підказка (наведіть на крапку).</li><li>Період — ледь помітний рядок: ‹ 2025 ›, крок, 🕘 час доби, ☀/☾, три кружечки палітр (назва — у підказці). Масштаб — унизу праворуч.</li><li>Телефон (звузьте вікно): картка знизу з відступами, період — одна кнопка «2025 ▾».</li></ul>']};
function show(el,v){$(el).hidden=!v}
function render(){
 const st=STAN==='stane';
 document.querySelectorAll('#mstan button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===STAN));
 document.querySelectorAll('#mpl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===PK));
 document.body.dataset.t=st?THEME:'svitla';
 $('#nav').innerHTML=navHTML();
 show('#oldpop',!st); show('#oldpan',!st); show('#zoomOld',!st); show('#tswOld',!st);
 show('#place',st&&!$('#place').dataset.closed); show('#per',st); show('#zoomNew',st);
 if(!st){$('#oldpop').innerHTML=oldPopHTML(); $('#oldpan').innerHTML=oldPanHTML()}
 else {$('#place').innerHTML=placeHTML(); $('#per').innerHTML=perHTML()}
 const [h,t]=NOTES[STAN]; $('#note').innerHTML=`<span class="x" id="nx2">×</span><h3>${h}</h3>${t}`; show('#note',NOTE);
 mapData(); placeOld(); setBase();
}
function placeOld(){ if($('#oldpop').hidden) return; const d=D(), q=map.project([d.lo,d.la]); $('#oldpop').style.left=q.x+'px'; $('#oldpop').style.top=(q.y+44)+'px'}
map.on('move',placeOld);
map.on('mousemove',e=>{const tip=$('#hovertip'); if(STAN!=='stane'||!hasL('adr')){tip.hidden=true;return}
 const f=map.queryRenderedFeatures([[e.point.x-6,e.point.y-6],[e.point.x+6,e.point.y+6]],{layers:['adr']})[0];
 if(!f){tip.hidden=true; map.getCanvas().style.cursor=''; return}
 map.getCanvas().style.cursor='pointer'; tip.hidden=false; tip.style.left=e.point.x+'px'; tip.style.top=(e.point.y+44)+'px';
 tip.innerHTML=`<b>${esc(f.properties.a)}</b> · ${f.properties.n} ${pl(f.properties.n,'подія','події','подій')}`});
function go(pk){PK=pk; PTAB='ogl'; OPEN=-1; ALLEV=false; delete $('#place').dataset.closed; map.jumpTo({center:[D().lo,D().la],zoom:15.8}); render()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v]');
 if(t&&t.closest('#mstan')){STAN=t.dataset.v; render(); return}
 if(t&&t.closest('#mpl')){go(+t.dataset.v); return}
 if(e.target.id==='mnote'||e.target.id==='nx2'){NOTE=e.target.id==='mnote'?!NOTE:false; show('#note',NOTE); return}
 const p=e.target.closest('[data-p]'); if(p){PTAB=p.dataset.p; OPEN=-1; render(); return}
 const dc=e.target.closest('.dec'); if(dc){OPEN=+dc.dataset.i===OPEN?-1:+dc.dataset.i; const s=$('#place .tb').scrollTop; render(); $('#place .tb').scrollTop=s; return}
 if(e.target.id==='allev'){ALLEV=true; render(); return}
 if(e.target.closest('#place .close')){$('#place').dataset.closed=1; $('#place').hidden=true; return}
 const st=e.target.closest('[data-st]'); if(st){STEP=st.dataset.st; PIDX=periods(STEP).length-1; render(); return}
 if(e.target.id==='pv'){PIDX=Math.max(0,PIDX-1); render(); return}
 if(e.target.id==='nx'){PIDX=Math.min(periods(STEP).length-1,PIDX+1); render(); return}
 if(e.target.closest('#thb')){THEME=THEME==='svitla'?'temna':'svitla'; render(); return}
 const pa=e.target.closest('[data-pal]'); if(pa){PALK=pa.dataset.pal; render(); return}
 if(e.target.closest('#todb')){const m=$('#todm'), r=e.target.closest('#todb').getBoundingClientRect();
  m.innerHTML=['уся доба','ніч 0–6','ранок 6–12','день 12–18','вечір 18–24'].map(x=>`<button data-tod="${x}" aria-pressed="${x===TOD}">${x}</button>`).join('');
  m.style.left=r.left+'px'; m.hidden=!m.hidden; return}
 const td=e.target.closest('[data-tod]'); if(td){TOD=td.dataset.tod; $('#todm').hidden=true; render(); return}
 if(!e.target.closest('#todm')) $('#todm').hidden=true;
 if(e.target.closest('#map')&&STAN==='stane'&&hasL('adr')){const r=map.getCanvas().getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const f=map.queryRenderedFeatures([[x-6,y-6],[x+6,y+6]],{layers:['adr']})[0];
  if(f&&f.properties.a===D().addr){delete $('#place').dataset.closed; show('#place',true)}}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){$('#place').dataset.closed=1; $('#place').hidden=true; $('#todm').hidden=true}});
render();
</script></body></html>
