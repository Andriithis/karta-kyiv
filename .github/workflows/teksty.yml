name: Прохід по текстах

# Крок 6 (ZAVDANNYA-TEKSTY.md): один прохід по текстах рішень — фабула з
# логічними межами, дата й час події, речення адреси, адреса й клас B/C/D.
# Щодня бере наступну порцію черги (МАЙ, НАР, НАС → ГП, АЛК, СЕР → ДОР) і
# кладе її окремою частиною в data/teksty. Коли черга пройде, той самий
# щоденний запуск підбирає нові документи тижня.

on:
  # Щоденний розклад увімкнено 24.09 після ZVIT-TEKSTY-3 (пороги пройдено):
  # решту черги (ДОР) бот дожене сам, далі — нові документи.
  schedule:
    - cron: '0 22 * * *'       # щодня о 22:00 UTC — між запусками «Оновлення карти»
  workflow_dispatch:
    inputs:
      max_docs:
        description: 'Бюджет документів на цей запуск'
        default: '30000'

permissions:
  contents: write

# Та сама група, що й в «Оновленні карти» та «Формі рішення»: усі комітять у
# data/, і одночасний запуск дав би конфлікт при пуші.
concurrency:
  group: karta-update
  cancel-in-progress: false

jobs:
  teksty:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Повні тексти рішень (PLAN-BAZA.md): постійне місце — реліз «teksty»
    # приватного репозиторію DANI_REPO, токен — секрет DANI_TOKEN. Доки
    # секрету немає, тексти лягають в артефакт запуску на 90 днів.
    env:
      DANI_REPO: Andriithis/dani-edrsr
      DANI_TOKEN: ${{ secrets.DANI_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Посилання на тексти: поточний рік — із свіжого дампу, минулі — з
      # data/posylannya (докачує лише відсутні роки).
      - name: Посилання на тексти рішень
        run: |
          python src/step0_fetch_dump.py $(date +%Y) || true
          python src/step0_fetch_dump.py --posylannya || true

      - name: Прохід по текстах
        env:
          MAX_DOCS: ${{ github.event.inputs.max_docs || '30000' }}
        run: python src/step1c_teksty.py

      # Місячний архів у релізі дописується: старий файл + новий xz-потік
      # підряд — це коректний .xz. --clobber замінює файл цілком.
      - name: Повні тексти — у приватний репозиторій
        id: dani
        if: always() && env.DANI_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DANI_TOKEN }}
        run: |
          set -e
          [ -d vykhid/teksty ] || { echo "текстів немає"; exit 0; }
          gh release view teksty -R "$DANI_REPO" >/dev/null 2>&1 || \
            gh release create teksty -R "$DANI_REPO" --title "Повні тексти рішень" \
              --notes "Архіви по місяцях дати рішення: jsonl.xz, по рядку на рішення. Не публікувати."
          mkdir -p /tmp/rel
          for f in vykhid/teksty/*.jsonl.xz; do
            n=$(basename "$f")
            rm -f "/tmp/rel/$n.old"
            if gh release download teksty -R "$DANI_REPO" -p "$n" -O "/tmp/rel/$n.old" 2>/dev/null; then
              cat "/tmp/rel/$n.old" "$f" > "/tmp/rel/$n"
            else
              cp "$f" "/tmp/rel/$n"
            fi
            xz -t "/tmp/rel/$n"
            gh release upload teksty -R "$DANI_REPO" "/tmp/rel/$n" --clobber
            echo "$n — $(du -h "/tmp/rel/$n" | cut -f1)"
          done

      # Тимчасово, доки немає DANI_TOKEN, або якщо запис у реліз не вдався.
      # Увага: репозиторій публічний — артефакт може завантажити будь-хто,
      # хто увійшов у GitHub.
      - name: Повні тексти — артефакт запуску (90 днів)
        if: always() && (env.DANI_TOKEN == '' || steps.dani.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: teksty-${{ github.run_id }}
          path: vykhid/teksty/
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore

      - name: Зберегти частину
        run: |
          git config user.name  "karta-bot"
          git config user.email "actions@github.com"
          [ -d data/teksty ] && git add -f data/teksty && echo "додано data/teksty"
          [ -d data/posylannya ] && git add -f data/posylannya && echo "додано data/posylannya"
          [ -f data/formy.csv.gz ] && git add -f data/formy.csv.gz
          if git diff --quiet --cached; then
            echo "змін немає"
          else
            git commit -m "прохід по текстах $(date +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
