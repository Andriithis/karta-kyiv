name: Оновлення карти

on:
  schedule:
    - cron: '0 3 * * 1'        # щопонеділка о 03:00 UTC (06:00 за Києвом)
  workflow_dispatch:            # плюс кнопка ручного запуску
    inputs:
      max_docs:
        description: 'Максимум документів за цей запуск (0 = без обмеження)'
        default: '20000'
      refresh_risks:
        description: 'Перезавантажити шар ризиків з OSM'
        type: boolean
        default: false
      retrain_risk:
        description: 'Перенавчити модель ризику (крок 4) — довго, вручну раз на кілька місяців'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: karta-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Кеш адресної бази OSM
        uses: actions/cache@v4
        with:
          path: |
            data/osm_kyiv_city.json
            data/osm_risks_raw.json
            data/network.json
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: Крок 0 — свіжий дамп ЄДРСР
        run: |
          python src/step0_fetch_dump.py $(date +%Y)
          # минулий рік добираємо раз на місяць (перший понеділок)
          if [ "$(date +%d)" -le 07 ]; then
            python src/step0_fetch_dump.py $(( $(date +%Y) - 1 )) || true
          fi

      - name: Крок 1 — тексти рішень і адреси
        env:
          MAX_DOCS: ${{ github.event.inputs.max_docs || '20000' }}
        run: python src/step1_download.py

      - name: Крок 2 — геокодування
        run: python src/step2_geocode.py

      - name: Крок 2b — шар ризиків
        run: |
          if [ "${{ github.event.inputs.refresh_risks }}" = "true" ]; then
            rm -f data/osm_risks_raw.json
          fi
          python src/step2b_risks.py || echo "шар ризиків пропущено"

      - name: Крок 2c — мережевий аналіз
        env:
          ROUTES: '6000'
        run: python src/step2c_network.py || echo "мережевий аналіз пропущено"

      - name: Крок 2d — межі районів
        run: python src/step2d_borders.py || echo "межі районів пропущено (файл уже є або OSM недоступний)"

      - name: Крок 4 — перенавчання моделі ризику
        if: ${{ github.event.inputs.retrain_risk == 'true' }}
        run: |
          pip install --quiet numpy scikit-learn
          python src/step4_engine.py

      - name: Крок 3 — збірка карти
        run: python src/step3_map.py

      - name: Крок 5 — сайт з районами (викладач/слухач)
        run: python src/step5_site.py

      - name: Зберегти стан у репозиторії
        run: |
          git config user.name  "karta-bot"
          git config user.email "actions@github.com"
          for f in data/events.csv.gz data/risks.json data/network.json data/vykluchennya.txt data/borders.json data/engine_report.json data/risk.json; do
            [ -f "$f" ] && git add -f "$f" && echo "додано $f"
          done
          if git diff --quiet --cached; then
            echo "змін немає"
          else
            git commit -m "оновлення даних $(date +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Підготувати сторінку
        run: |
          if [ ! -f karta.html ]; then
            echo "::error::karta.html не створено — дивіться кроки 2 і 3"
            exit 1
          fi
          if [ ! -d site/vykladach ] || [ ! -d site/slukhach ]; then
            echo "::error::site/ не зібрано — дивіться крок 5"
            exit 1
          fi
          mkdir -p _site
          cp -r site/vykladach _site/vykladach
          cp -r site/slukhach  _site/slukhach
          cp karta.html _site/karta.html
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html><html lang="uk"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Карта правопорушень Києва</title><style>
          *{box-sizing:border-box}body{margin:0;background:#0f1117;color:#e8eaf0;
           font:15px/1.5 system-ui,sans-serif;padding:60px 22px}
          .wrap{max-width:640px;margin:0 auto}
          h1{font-size:25px;margin:0 0 8px;letter-spacing:-.02em}
          .sub{color:#79839a;font-size:14px;margin-bottom:30px}
          a.card{display:block;text-decoration:none;color:inherit;background:#171a23;
           border:1px solid #252a37;border-radius:11px;padding:18px 20px;margin-bottom:12px;transition:.14s}
          a.card:hover{background:#1c2030;border-color:#3a4256;transform:translateY(-2px)}
          .nm{font-size:16.5px;font-weight:600;margin-bottom:5px}
          .ds{color:#8b95a8;font-size:13px}
          </style></head><body><div class="wrap">
          <h1>Карта правопорушень Києва</h1>
          <div class="sub">Аналіз за даними ЄДРСР. Академія патрульної поліції, Київ.</div>
          <a class="card" href="vykladach/index.html"><div class="nm">Повна версія (викладач)</div>
          <div class="ds">10 районних карт з поділом на проблеми, аномалії, інциденти та повною методологією</div></a>
          <a class="card" href="slukhach/index.html"><div class="nm">Версія для слухачів</div>
          <div class="ds">ті самі 10 районних карт без готових висновків — для самостійного аналізу</div></a>
          <a class="card" href="karta.html"><div class="nm">Єдина карта міста</div>
          <div class="ds">весь Київ на одній карті, без поділу на райони</div></a>
          </div></body></html>
          HTMLEOF
          echo "розмір карти: $(du -h karta.html | cut -f1)"
          printf '%s' "$(date -u +'%Y-%m-%d %H:%M UTC')" > _site/updated.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4