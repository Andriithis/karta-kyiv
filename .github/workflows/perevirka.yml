name: Перевірка збірки

# Перевірка змін у карті без публікації (RISHENNYA 36.49, 31.10): на ПК
# Андрія 0,5 ГБ вільної пам'яті, локальна збірка йде годинами. Тут — та сама
# збірка, що в «Оновленні карти», але без свіжого дампу ЄДРСР і без
# перенавчання: `check_build` і знімки Playwright за сценами `znimky/*.json`.
# Результат — артефакт «perevirka» (знімки й журнал). У main нічого не
# комітиться, сайт не публікується. Запуск лише вручну:
#   gh workflow run "Перевірка збірки" -f stseny=znimky/etap1.json -f ref=main

on:
  workflow_dispatch:
    inputs:
      stseny:
        description: 'Сцени знімків — JSON-файли через пробіл (порожньо — без знімків)'
        default: ''
      ref:
        description: 'Гілка чи коміт'
        default: 'main'
      check_build:
        description: 'Проганяти check_build'
        type: boolean
        default: true
      ryzyk:
        description: 'Перенавчити ризик (крок 4, ~2 год) — risk.json і звіт моделі в артефакт, без публікації'
        type: boolean
        default: false
      n_stab:
        description: 'Прогонів відбору стійкості (100 за методикою)'
        default: '100'

permissions:
  contents: read

concurrency:
  group: karta-perevirka-${{ github.event.inputs.ref }}-${{ github.event.inputs.stseny }}
  cancel-in-progress: true

jobs:
  perevirka:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # Знімки «до» — на старому коміті, де ще немає скрипта знімків, сцен і
      # requirements.txt: беремо їх з main (до setup-python — кеш pip читає
      # requirements.txt)
      - name: Скрипт знімків, сцени й версії пакетів з main
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- src/znimky.py znimky || echo "скрипта знімків у main немає"
          [ -f requirements.txt ] || git checkout FETCH_HEAD -- requirements.txt || true
          git reset -q

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Знімок OSM з гілки osm
        run: |
          if git fetch --depth=1 origin osm && git checkout FETCH_HEAD -- osm; then
            git reset -q
            gunzip -c osm/osm_kyiv_city.json.gz > data/osm_kyiv_city.json
            gunzip -c osm/osm_risks_raw.json.gz > data/osm_risks_raw.json
          else
            echo "::warning::знімка OSM немає"
          fi

      - name: Дані 1551 для збірки
        run: |
          if git fetch --depth=1 origin analiz-1551 && git checkout FETCH_HEAD -- data/1551; then
            git reset -q -- data/1551
          else
            echo "1551 недоступний"
          fi

      # Без дампу: база — зі знімка events.csv.gz, як у «Оновленні карти» з
      # галочкою «без свіжого дампу»; перевіряємо код, а не нові документи
      - name: База зі знімка, геокодування, установи, межі
        env:
          BEZ_DAMPU: '1'
          MAX_DOCS: '0'
        run: |
          python src/step1_download.py
          python src/step2_geocode.py
          python src/step2b_risks.py
          python src/step2d_borders.py || echo "межі районів пропущено"

      # Перенавчання ризику без публікації (ZAVDANNYA-41, 2.2): нову модель
      # видно на знімках і в артефакті ще до того, як вона піде на сайт
      - name: Крок 4 — модель ризику
        if: ${{ github.event.inputs.ryzyk == 'true' }}
        env:
          N_STAB: ${{ github.event.inputs.n_stab || '100' }}
        run: |
          pip install --quiet -c requirements.txt numpy scikit-learn statsmodels
          python src/step4_engine.py

      - name: Збірка карти
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          pip install --quiet -c requirements.txt numpy
          python src/step3_map.py 2>&1 | tee vykhid_zbirka.txt
          python src/step5_site.py

      - name: Playwright
        run: pip install --quiet -c requirements.txt playwright && python -m playwright install --with-deps chromium > /dev/null

      - name: check_build
        if: ${{ github.event.inputs.check_build == 'true' }}
        run: python src/check_build.py 2>&1 | tee vykhid_check.txt; exit ${PIPESTATUS[0]}

      - name: Знімки
        if: ${{ always() && github.event.inputs.stseny != '' }}
        run: python src/znimky.py ${{ github.event.inputs.stseny }}

      # Відео Playwright (VP8 без стиснення) — десятки МБ на хвилину; для
      # перегляду центральним чатом і репо — VP9 до 1280 px (ZAVDANNYA-41, 3.6)
      - name: Стиснути відео
        if: ${{ always() && github.event.inputs.stseny != '' }}
        run: |
          for f in vykhid/znimky-perevirka/*.webm; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "scale='min(1280,iw)':-2" -c:v libvpx-vp9 -crf 42 -b:v 0 -row-mt 1 -an "${f%.webm}.vp9.webm"               && mv "${f%.webm}.vp9.webm" "$f" && echo "$f: $(du -h "$f" | cut -f1)"
          done

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perevirka
          path: |
            vykhid/znimky-perevirka
            vykhid/znimky
            vykhid_check.txt
            vykhid_zbirka.txt
            data/kandydaty.json.gz
            data/problems_report.json.gz
            data/risk.json
            data/engine_report.json
            data/radiusy.json
            doslidzhennya/ZVIT-KROK7.md
          if-no-files-found: ignore
          retention-days: 14
